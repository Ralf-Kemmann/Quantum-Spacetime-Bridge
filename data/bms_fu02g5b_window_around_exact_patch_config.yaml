role_variants:
  - variant_id: "v0_type_preferred"
    mode: "v0_type_preferred"
    enabled: true
    description: "Baseline role assignment: mixed_core and pentagon_boundary retain current v0 role labels."
    random_seed:

  - variant_id: "uncolored_carrier_only"
    mode: "uncolored_carrier_only"
    enabled: true
    description: "All carrier nodes receive one generic carrier role; internal coloring erased."
    random_seed:

  - variant_id: "face_type_only"
    mode: "face_type_only"
    enabled: true
    description: "Roles are assigned only by H/P face type labels."
    random_seed:

  - variant_id: "swap_core_boundary"
    mode: "swap_core_boundary"
    enabled: true
    description: "Mixed-core and pentagon-boundary roles are intentionally swapped."
    random_seed:

  - variant_id: "core_erased"
    mode: "core_erased"
    enabled: true
    description: "Mixed-core role erased into generic carrier; boundary role retained."
    random_seed:

  - variant_id: "boundary_erased"
    mode: "boundary_erased"
    enabled: true
    description: "Boundary role erased into generic carrier; mixed-core role retained."
    random_seed:

  - variant_id: "random_role_permutation_seed_104729"
    mode: "random_role_permutation_seeded"
    enabled: false
    description: "Seeded random permutation of carrier roles preserving baseline role counts."
    random_seed: 104729

report:
  write_result_note: true
  write_candidate_pair_summary: true
  write_config_resolved: true
