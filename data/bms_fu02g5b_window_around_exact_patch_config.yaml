# BMS-FU02g5 — Role-Assignment Sensitivity Controls
# Date: 2026-05-06
# Project: Quantum–Spacetime Bridge / Gravitation und RaumZeit
#
# Edit only input.full_face_graph_edges_csv if your local C60 face-graph edge list
# uses a different path.

run:
  run_id: "BMS-FU02g5b_window_around_exact_patch_v0"
  case_id: "FU02g5b_window_around_exact_patch"
  output_dir: "runs/BMS-FU02g5b/window_around_exact_patch"
  patch_size: 17

  # Window controls. Conservative default: smoke/candidate comparison only.
  # Set enumerate_connected_patches: true for windowed enumeration.
  enumerate_connected_patches: true
  skip_first_connected_patches: 26187000
  max_connected_patches_this_run: 500
  max_wall_seconds: 300
  progress_every: 100

  # Coarse near-distance threshold for role-degree histogram diagnostic.
  # This is a sensitivity diagnostic, not automatically identical to FU02g4c near logic.
  near_distance_threshold: 2

input:
  # Required for graph-based validation/signatures.
  # If this file does not exist locally, replace with the actual C60 face-graph edge CSV.
  full_face_graph_edges_csv: "runs/BMS-FU02d1/face_parser_repair_and_face_localization_open/bms_fu02d1_face_adjacency_edges.csv"

  reference_carrier_nodes:
