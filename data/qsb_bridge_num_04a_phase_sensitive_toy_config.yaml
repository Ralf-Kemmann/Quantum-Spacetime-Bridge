  summary_json: runs/QSB-BRIDGE-NUM-04A/phase_sensitive_toy_open/summary.json
  readout_md: runs/QSB-BRIDGE-NUM-04A/phase_sensitive_toy_open/readout.md
  variant_summary_csv: runs/QSB-BRIDGE-NUM-04A/phase_sensitive_toy_open/phase_toy_variant_summary.csv
  pairwise_diagnostics_csv: runs/QSB-BRIDGE-NUM-04A/phase_sensitive_toy_open/phase_toy_pairwise_diagnostics.csv
  resolved_config_json: runs/QSB-BRIDGE-NUM-04A/phase_sensitive_toy_open/phase_toy_config_resolved.json
  result_note_md: docs/QSB_BRIDGE_NUM_04A_RESULT_NOTE.md

claim_boundary:
  - This is a toy diagnostic, not a physical proof.
  - K_ij and d_ij are toy objects in this run.
  - D_ij is a distance-like construction, not a spacetime metric.
  - Phase-sensitive toy diagnostics are interference-like diagnostics, not real quantum dynamics.
  - Magnitude invariance does not establish spacetime emergence.
  - Phase response does not establish de-Broglie physics.
  - Geometry Proxy remains Proxy.
  - The integrated bridge map remains methodological.
