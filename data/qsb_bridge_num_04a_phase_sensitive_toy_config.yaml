description: Phase-sensitive toy diagnostic for magnitude/phase separation.

parameters:
  n_nodes: 12
  l0: 2.0
  tau: 0.35
  epsilon: 1.0e-12
  tolerance: 1.0e-12
  base_distance: circular_index_distance

phase_variants:
  - phase_zero
  - phase_linear_gradient
  - phase_random_low
  - phase_random_high
  - phase_vortex_like

phase_parameters:
  phase_linear_gradient_step: 0.45
  phase_random_low_seed: 4104
  phase_random_low_amplitude: 0.35
  phase_random_high_seed: 4105
  phase_random_high_amplitude: 2.4
  phase_vortex_winding: 1.0
  phase_vortex_sine_amplitude: 0.85

outputs:
