run_id: wave_identity_residual_control_stress_open
random_seed: 20260520
output_dir: runs/QSB-ST-COMP01D1C/wave_identity_residual_control_stress_open

normalization:
  epsilon: 1.0e-12
  similarity_scale: 1.0
  phase_wrap_mode: principal_interval_minus_pi_pi

decision_thresholds:
  near_zero_residual_max: 1.0e-9
  near_duplicate_residual_max: 0.15
  control_mimicry_ratio_warning: 0.85
  residual_matched_delta_max: 0.02
  weight_sensitivity_shift_warning: 0.10

weight_sets:
  - weight_set_id: equal_weights
    spectral_component: 0.3333333333
    phase_component: 0.3333333333
    local_component: 0.3333333333

  - weight_set_id: spectral_dominant
    spectral_component: 0.60
    phase_component: 0.20
    local_component: 0.20

  - weight_set_id: phase_dominant
    spectral_component: 0.20
    phase_component: 0.60
    local_component: 0.20

  - weight_set_id: local_dominant
    spectral_component: 0.20
    phase_component: 0.20
    local_component: 0.60

  - weight_set_id: spectral_off
    spectral_component: 0.00
    phase_component: 0.50
    local_component: 0.50

  - weight_set_id: phase_off
    spectral_component: 0.50
    phase_component: 0.00
    local_component: 0.50

  - weight_set_id: local_off
    spectral_component: 0.50
    phase_component: 0.50
    local_component: 0.00

