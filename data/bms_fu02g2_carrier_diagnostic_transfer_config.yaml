# BMS-FU02g2 — Carrier Diagnostic Transfer to Geometry-Class Controls Config
# Date: 2026-05-02
# Project: Gravitation und RaumZeit / Quantum-Spacetime-Bridge

run:
  run_id: "BMS-FU02g2_carrier_diagnostic_transfer_geometry_controls_open"
  output_dir: "runs/BMS-FU02g2/carrier_diagnostic_transfer_geometry_controls_open"

structures:
  c60_reference:
    enabled: true
    structure_id: "c60_reference"
    structure_class: "fullerene"
    geometry_class: "closed_curved_cage"
    nodes_csv: "data/bms_fu02g_c60_reference_nodes.csv"
    edges_csv: "data/bms_fu02g_c60_reference_edges.csv"
    cells_csv: "data/bms_fu02g_c60_reference_cells.csv"
    manifest_json: "data/bms_fu02g_c60_reference_manifest.json"

  graphene_patch:
    enabled: true
    structure_id: "graphene_patch"
    structure_class: "graphene_patch"
    geometry_class: "flat_2d_open_hexagonal_patch"
    nodes_csv: "data/bms_fu02g_graphene_patch_nodes.csv"
    edges_csv: "data/bms_fu02g_graphene_patch_edges.csv"
    cells_csv: "data/bms_fu02g_graphene_patch_cells.csv"
    manifest_json: "data/bms_fu02g_graphene_patch_manifest.json"

  nanotube_armchair_repaired:
    enabled: true
    structure_id: "nanotube_armchair_repaired"
    structure_class: "nanotube"
    geometry_class: "open_curved_cylindrical_hexagonal_graph"
    nodes_csv: "data/bms_fu02g1b_nanotube_armchair_repaired_nodes.csv"
    edges_csv: "data/bms_fu02g1b_nanotube_armchair_repaired_edges.csv"
    cells_csv: "data/bms_fu02g1b_nanotube_armchair_repaired_cells.csv"
    manifest_json: "data/bms_fu02g1b_nanotube_armchair_repaired_manifest.json"

  nanotube_zigzag_repaired:
    enabled: true
    structure_id: "nanotube_zigzag_repaired"
    structure_class: "nanotube"
    geometry_class: "open_curved_cylindrical_hexagonal_graph"
    nodes_csv: "data/bms_fu02g1b_nanotube_zigzag_repaired_nodes.csv"
    edges_csv: "data/bms_fu02g1b_nanotube_zigzag_repaired_edges.csv"
    cells_csv: "data/bms_fu02g1b_nanotube_zigzag_repaired_cells.csv"
    manifest_json: "data/bms_fu02g1b_nanotube_zigzag_repaired_manifest.json"

optional_reference:
  c60_fu02f1_face_layout_csv: "runs/BMS-FU02f1/face_id_interval_repair_3d_graph_layout_open/bms_fu02f1_face_layout.csv"
  use_if_present: true

diagnostic:
  top_fraction: 0.30
  minimum_carrier_cells: 5
  score_weights:
    cell_adjacency_degree: 1.00
    mean_node_degree: 0.75
    two_cell_edge_fraction: 0.50
    boundary_cell_penalty: 0.75
    low_degree_node_fraction_penalty: 0.50
